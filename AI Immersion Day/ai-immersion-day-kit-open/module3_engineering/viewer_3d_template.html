<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dominant Spec 3D</title>
<style>
  html,body{margin:0;height:100%;background:#0f1216;color:#e8ecef;font-family:system-ui,sans-serif;overflow:hidden}
  #hud{position:absolute;left:16px;top:12px;font-size:13px;line-height:1.5;background:rgba(0,0,0,.45);padding:10px 14px;border-radius:8px}
  #hud b{font-size:15px}
</style>
</head>
<body>
<div id="hud"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// OPTIONAL MODULE 3 STEP: parametric 3D model generated from the dominant spec.
// The python app replaces the line below with the real spec JSON.
const SPEC = /*SPEC*/{"body_paint":"RR-301","body_paint_name":"Rosso Racing Red","door_paint":"RR-301","door_paint_name":"Rosso Racing Red","mirror_code":"MR-GB","bonnet_code":"BN-SCOOP","wheel_code":"WH-5S-19","wheel_name":"19in Aero 5-spoke alloy"}/*END*/;
const HEX = {"RR-301":0xC8102E,"CR-305":0x7B1E2B,"MB-118":0x1D2F6F,"SB-120":0x5FA8D3,"GW-001":0xF4F5F0,"OB-900":0x111111,"LS-450":0xB7BCC2,
  "GG-460":0x4A4E54,"SO-220":0xE8702A,"SY-240":0xF2C230,"BG-330":0x1F4D2E,"VL-777":0x9BE22D,"UV-610":0x5B2A86,"PK-650":0xE75480};
const body = HEX[SPEC.body_paint] ?? 0x888888, door = HEX[SPEC.door_paint] ?? body;
const mirror = {"MR-BODY":body,"MR-GB":0x111111,"MR-SILVER":0xB7BCC2,"MR-CARBON":0x2b2b2b}[SPEC.mirror_code] ?? 0xff00ff;
document.getElementById('hud').innerHTML = `<b>${SPEC.body_paint_name} (${SPEC.body_paint})</b><br>Doors: ${SPEC.door_paint_name}<br>Mirrors: ${SPEC.mirror_code} · Bonnet: ${SPEC.bonnet_code}<br>Wheels: ${SPEC.wheel_name}<br><small>drag to rotate · scroll to zoom</small>`;

const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0f1216);
const cam = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 100);
const r = new THREE.WebGLRenderer({antialias:true}); r.setSize(innerWidth, innerHeight); r.setPixelRatio(devicePixelRatio); document.body.appendChild(r.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x333344, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.9); sun.position.set(5,8,6); scene.add(sun);
const paint = c => new THREE.MeshStandardMaterial({color:c, metalness:0.35, roughness:0.35});
const car = new THREE.Group(); scene.add(car);
const box = (w,h,d,c,x,y,z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), paint(c)); m.position.set(x,y,z); car.add(m); return m; };

box(4.2,0.7,1.8, body, 0,0.75,0);                       // lower body
box(2.1,0.6,1.6, body, 0.3,1.4,0);                      // cabin
box(2.0,0.5,1.62, 0x9fc9e6, 0.3,1.42,0).material.opacity=0.6; // glass band
box(1.0,0.55,0.04, door, 0.1,0.8, 0.91); box(1.0,0.55,0.04, door, 0.1,0.8,-0.91); // doors
box(0.18,0.12,0.25, mirror, -0.75,1.25, 1.0); box(0.18,0.12,0.25, mirror, -0.75,1.25,-1.0); // mirrors
if (SPEC.bonnet_code === "BN-SCOOP") { box(0.7,0.22,0.6, body, -1.3,1.2,0); box(0.05,0.14,0.45, 0x111111, -1.66,1.2,0); }
if (SPEC.bonnet_code === "BN-DOME") { const d = new THREE.Mesh(new THREE.SphereGeometry(0.6,24,12,0,Math.PI*2,0,Math.PI/2), paint(body)); d.scale.set(1.3,0.25,0.9); d.position.set(-1.3,1.1,0); car.add(d); }
if (SPEC.bonnet_code === "BN-VENT") for (let i=0;i<4;i++) box(0.08,0.03,0.7, 0x111111, -1.6+i*0.2,1.12,0);
if (SPEC.bonnet_code === "BN-STRIPE") { box(4.25,0.02,0.18, 0xffffff, 0,1.11,0.15); box(4.25,0.02,0.18, 0xffffff, 0,1.11,-0.15); }
box(0.05,0.15,0.35, 0xfff3b0, -2.11,0.9,0.6); box(0.05,0.15,0.35, 0xfff3b0, -2.11,0.9,-0.6);
box(0.05,0.15,0.35, 0xff2020, 2.11,0.9,0.6); box(0.05,0.15,0.35, 0xff2020, 2.11,0.9,-0.6);

const big = SPEC.wheel_code === "WH-AT-18", rad = big ? 0.55 : 0.45;
for (const [x,z] of [[-1.35,0.95],[1.35,0.95],[-1.35,-0.95],[1.35,-0.95]]) {
  const w = new THREE.Group(); w.position.set(x,rad,z); car.add(w);
  const tyre = new THREE.Mesh(new THREE.CylinderGeometry(rad,rad,big?0.42:0.3,28), paint(0x151515)); tyre.rotation.x = Math.PI/2; w.add(tyre);
  const rimC = SPEC.wheel_code === "WH-TB-19" ? 0x3a3d42 : 0xbfc4c9;
  const rim = new THREE.Mesh(new THREE.CylinderGeometry(rad*0.62,rad*0.62,0.32,24), paint(rimC)); rim.rotation.x = Math.PI/2; w.add(rim);
  const n = {"WH-5S-19":5,"WH-MS-20":14,"WH-TB-19":8,"WH-AT-18":6,"WH-ST-16":0}[SPEC.wheel_code] ?? 5;
  for (let i=0;i<n;i++){ const g = new THREE.BoxGeometry(0.07, rad*0.6, 0.02); g.translate(0, rad*0.3, 0); const s = new THREE.Mesh(g, paint(0x555a60)); s.rotation.z = i*Math.PI*2/n; s.position.z = Math.sign(z)*0.17; w.add(s); }
}
const ground = new THREE.Mesh(new THREE.CircleGeometry(6,48), new THREE.MeshStandardMaterial({color:0x1b2026})); ground.rotation.x=-Math.PI/2; scene.add(ground);

let yaw = 0.7, pitch = 0.35, dist = 8, drag = null;
addEventListener('pointerdown', e => drag = [e.clientX, e.clientY]);
addEventListener('pointerup', () => drag = null);
addEventListener('pointermove', e => { if (!drag) return; yaw -= (e.clientX-drag[0])*0.01; pitch = Math.min(1.2, Math.max(0.05, pitch + (e.clientY-drag[1])*0.01)); drag = [e.clientX, e.clientY]; });
addEventListener('wheel', e => dist = Math.min(16, Math.max(4, dist + e.deltaY*0.01)));
addEventListener('resize', () => { cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix(); r.setSize(innerWidth, innerHeight); });
(function loop(){ if (!drag) yaw += 0.003;
  cam.position.set(dist*Math.cos(pitch)*Math.sin(yaw), dist*Math.sin(pitch)+0.6, dist*Math.cos(pitch)*Math.cos(yaw)); cam.lookAt(0,0.8,0);
  r.render(scene, cam); requestAnimationFrame(loop); })();
</script>
</body>
</html>
